<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BusVideos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 24px;
            background-color: #ffffff;
        }
        h1 {
            font-size: 28px;
        }
        p {
            font-size: 16px;
        }
        .btn {
            display: block;
            margin: 16px auto;
            padding: 14px;
            width: 100%;
            max-width: 320px;
            font-size: 18px;
            color: white;
            background-color: #1a73e8;
            border-radius: 6px;
            text-decoration: none;
        }
        .secondary {
            background-color: #4caf50;
        }
        .note {
            font-size: 14px;
            color: #555;
            margin-top: 24px;
        }
    </style>
</head>
<body>

<h1>🎬 BusVideos</h1>
<p>Entretenimiento a bordo</p>

<!-- BOTÓN ABRIR APP -->
<a class="btn" id="btnAbrir">▶ Abrir BusVideos</a>

<!-- BOTÓN INSTALAR -->
<a class="btn secondary" href="BusVideos.apk">⬇ Instalar BusVideos</a>

<p class="note">
    Si ya tienes la app instalada, pulsa <b>Abrir BusVideos</b><br>
    Caso contrario, instálala primero
</p>

<script>
    const params = new URLSearchParams(window.location.search);
    const bus = params.get("bus");

    // 👉 Deep link único hacia la app
    let abrirLink = "busvideos://open";
    if (bus) {
        abrirLink += `?bus=${bus}`;
    }

    document.getElementById("btnAbrir").href = abrirLink;
</script>

</body>
</html>
