<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />

  <title>BusVideos</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
      background-color: #ffffff;
      margin: 0;
    }

    .contenedor {
      max-width: 380px;
      margin: 0 auto;
      padding-top: 35px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 6px;
      color: #1565C0;
    }

    .subtitulo {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 30px;
      color: #333333;
    }

    .btn {
      display: block;
      box-sizing: border-box;
      width: 100%;
      margin: 14px auto;
      padding: 14px;

      border: none;
      border-radius: 8px;

      font-size: 17px;
      font-weight: bold;

      color: white;
      text-decoration: none;

      cursor: pointer;
    }

    /* Instalar ServiZona */
    .instalar {
      background-color: #43A047;
    }

    /* Ingresar a BusVideos */
    .ingresar {
      background-color: #1565C0;
    }

    /* Activar / Reactivar / Reinstalar */
    .activar {
      background-color: #FB8C00;
    }

    .estado {
      margin-top: 25px;
      font-size: 15px;
      font-weight: bold;
      color: #263238;
    }

    .nota {
      margin-top: 28px;
      font-size: 13px;
      line-height: 1.5;
      color: #607D8B;
    }

    .oculto {
      display: none;
    }

  </style>

</head>

<body>

  <div class="contenedor">

    <h1>🎬 BusVideos</h1>

    <p class="subtitulo">
      Entretenimiento a bordo
    </p>


    <!-- ====================================== -->
    <!-- INSTALAR SERVIZONA                     -->
    <!-- Se conectará al APK cuando esté listo  -->
    <!-- ====================================== -->

    <a
      class="btn instalar"
      id="btnInstalar"
      href="#"
    >
      ⬇ Instalar ServiZona
    </a>


    <!-- ====================================== -->
    <!-- INGRESAR A BUSVIDEOS                   -->
    <!-- Solo se mostrará si está ACTIVO        -->
    <!-- ====================================== -->

    <a
      class="btn ingresar oculto"
      id="btnIngresar"
      href="#"
    >
      ▶ Ingresar a BusVideos
    </a>


    <!-- ====================================== -->
    <!-- ACTIVAR / REACTIVAR / REINSTALAR       -->
    <!-- ====================================== -->

    <a
      class="btn activar oculto"
      id="btnActivar"
      href="#"
    >
      Activar servicio
    </a>


    <p
      class="estado"
      id="estadoServicio"
    >
    </p>


    <p
      class="nota"
      id="mensaje"
    >
    </p>

  </div>


  <script>

    // =====================================================
    // BUSVIDEOS + SERVIZONA
    // PÁGINA PERMANENTE DEL QR DEL BUS
    // =====================================================

    const params =
      new URLSearchParams(window.location.search);

    const codigoBus =
      params.get("bus");


    const btnInstalar =
      document.getElementById("btnInstalar");

    const btnIngresar =
      document.getElementById("btnIngresar");

    const btnActivar =
      document.getElementById("btnActivar");

    const estadoServicio =
      document.getElementById("estadoServicio");

    const mensaje =
      document.getElementById("mensaje");


    // =====================================================
    // BOTÓN INSTALAR SERVIZONA
    // =====================================================
    //
    // TODAVÍA NO DESCARGAMOS NADA.
    // Cuando ServiZona esté terminada conectaremos aquí
    // la APK definitiva.
    // =====================================================

    btnInstalar.addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        alert(
          "La instalación de ServiZona se habilitará próximamente."
        );
      }
    );


    // =====================================================
    // VALIDAR QUE EL QR CONTENGA CÓDIGO DE BUS
    // =====================================================

    if (!codigoBus) {

      estadoServicio.innerHTML =
        "Código de bus no detectado.";

      mensaje.innerHTML =
        "Escanee nuevamente el código QR ubicado en el bus.";

    } else {

      // ===================================================
      // POR AHORA SOLO CONFIRMAMOS EL BUS
      //
      // En el siguiente paso consultaremos el backend
      // para conocer:
      //
      // ACTIVO
      // SUSPENDIDO
      // INACTIVO
      // NO ACTIVADO
      // ===================================================

      mensaje.innerHTML =
        "Código de bus detectado: <b>" +
        codigoBus +
        "</b>";

    }

  </script>

</body>

</html>
