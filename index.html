<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>BusVideos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
      background-color: #ffffff;
    }
    h1 { font-size: 28px; margin-bottom: 6px; }
    p { font-size: 16px; margin-top: 0; }
    .btn {
      display: block;
      margin: 16px auto;
      padding: 14px;
      width: 100%;
      max-width: 320px;
      font-size: 18px;
      color: white;
      background-color: #4caf50;
      border-radius: 6px;
      text-decoration: none;
    }
    .primary { background-color: #1a73e8; }
    .note {
      font-size: 14px;
      color: #555;
      margin-top: 24px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<h1>🎬 BusVideos</h1>
<p>Entretenimiento a bordo</p>

<a class="btn" id="btnInstalar" href="BusVideos.apk">⬇ Instalar BusVideos</a>

<a class="btn primary" id="btnActivar">▶ Activar BusVideos</a>

<p class="note" id="msg"></p>

<script>
  // ================================
  // BUSVIDEOS – CONTROL CENTRAL
  // ================================

  const params = new URLSearchParams(window.location.search);
  const bus = params.get("bus");
  const fromApp = params.get("from");

  const btnActivar = document.getElementById("btnActivar");
  const msg = document.getElementById("msg");

  // 🔧 Funciones utilitarias
  function disableActivar() {
    btnActivar.style.opacity = "0.5";
    btnActivar.style.pointerEvents = "none";
  }

  function enableActivar() {
    btnActivar.style.opacity = "1";
    btnActivar.style.pointerEvents = "auto";
  }

  // 🔗 Construir link de activación
  let activarLink = "busvideos://open?modo=activar";
  if (bus) activarLink += `&bus=${bus}`;
  btnActivar.href = activarLink;

  // ================================
  // LÓGICA PRINCIPAL
  // ================================

  if (fromApp === "app") {
    // 🟢 Viene desde la app → activar permitido
    enableActivar();
    msg.innerHTML =
      "Pulsa <b>Activar BusVideos</b> para continuar con la activación.";
  } else {
    // 🔴 Primera vez → debe instalar
    disableActivar();
    msg.innerHTML =
      "Paso 1: <b>Instala la app BusVideos</b>.<br>" +
      "Paso 2: Abre nuevamente esta página y pulsa <b>Activar BusVideos</b>.";
  }
</script>

</body>
</html>
