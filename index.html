<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>BusVideos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
      background-color: #ffffff;
    }
    h1 { font-size: 28px; margin-bottom: 6px; }
    p { font-size: 16px; margin-top: 0; }
    .btn {
      display: block;
      margin: 16px auto;
      padding: 14px;
      width: 100%;
      max-width: 320px;
      font-size: 18px;
      color: white;
      background-color: #4caf50;
      border-radius: 6px;
      text-decoration: none;
    }
    .primary { background-color: #1a73e8; }
    .note {
      font-size: 14px;
      color: #555;
      margin-top: 24px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<h1>🎬 BusVideos</h1>
<p>Entretenimiento a bordo</p>

<!-- BOTÓN INSTALAR -->
<a class="btn" id="btnInstalar" href="BusVideos.apk">⬇ Instalar BusVideos</a>

<!-- BOTÓN ACTIVAR (solo cliente) -->
<a class="btn primary" id="btnActivar">▶ Activar BusVideos</a>

<p class="note" id="msg"></p>

<script>
  const params = new URLSearchParams(window.location.search);

  // bus viene del QR: ?bus=BV-CCC-001
  const bus = params.get("bus");

  // Control temporal (hasta que exista backend)
  // cliente -> muestra Instalar + Activar
  // pasajero -> muestra solo Instalar
  const tipo = (params.get("tipo") || "cliente").toLowerCase();

  // Link de activar abre la app en modo activar
  let activarLink = "busvideos://open?modo=activar";
  if (bus) activarLink += `&bus=${encodeURIComponent(bus)}`;

  const btnActivar = document.getElementById("btnActivar");
  btnActivar.href = activarLink;

  const msg = document.getElementById("msg");

  if (tipo === "pasajero") {
    // Pasajero: NO ve activar
    btnActivar.style.display = "none";
    msg.innerHTML = "Instala la app para continuar.";
  } else {
    // Cliente: ve activar
    msg.innerHTML = "Después de instalar, pulsa <b>Activar BusVideos</b> e ingresa tu PIN y Código App.";
  }
</script>

</body>
</html>
