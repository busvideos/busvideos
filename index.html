<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>BusVideos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
      background-color: #ffffff;
    }
    h1 { font-size: 28px; margin-bottom: 6px; }
    p { font-size: 16px; margin-top: 0; }
    .btn {
      display: block;
      margin: 16px auto;
      padding: 14px;
      width: 100%;
      max-width: 320px;
      font-size: 18px;
      color: white;
      background-color: #4caf50;
      border-radius: 6px;
      text-decoration: none;
    }
    .primary { background-color: #1a73e8; }
    .note {
      font-size: 14px;
      color: #555;
      margin-top: 24px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<h1>🎬 BusVideos</h1>
<p>Entretenimiento a bordo</p>

<!-- BOTÓN INSTALAR -->
<a class="btn" id="btnInstalar" href="BusVideos.apk">
⬇ Instalar BusVideos
</a>

<!-- BOTÓN ACTIVAR -->
<a class="btn primary disabled" id="btnActivar">
▶ Activar BusVideos
</a>

<p class="note" id="msg"></p>

<script>
  const params = new URLSearchParams(window.location.search);
  const bus = params.get("bus");
  const fromApp = params.get("from");

  const btnActivar = document.getElementById("btnActivar");
  const msg = document.getElementById("msg");

  // 🔒 Estado inicial
  btnActivar.classList.add("disabled");
  btnActivar.style.pointerEvents = "none";

  msg.innerHTML =
    "Paso 1: <b>Instala la app BusVideos</b>.<br>" +
    "Paso 2: Abre nuevamente esta página y pulsa <b>Activar BusVideos</b>.";

  // 👉 Si vuelve desde la app, habilitamos Activar
  if (fromApp === "app") {
    btnActivar.classList.remove("disabled");
    btnActivar.style.pointerEvents = "auto";

    let activarLink = "busvideos://open?modo=activar";
    if (bus) activarLink += `&bus=${bus}`;
    btnActivar.href = activarLink;

    msg.innerHTML =
      "Pulsa <b>Activar BusVideos</b> para continuar con la activación.";
  }
</script>

<style>
  .disabled {
    opacity: 0.5;
  }
</style>

</body>
</html>
